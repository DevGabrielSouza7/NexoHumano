<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo | Psicologia Humanista</title>
    
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Biblioteca de Animações AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lato:wght@300;400;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600&family=Oswald:wght@300;400;500&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- ESTILOS BLINDADOS -->
    <style>
        html { scroll-behavior: smooth; }
        
        /* Ajuste do pulo do menu para a tela focar perfeitamente no conteúdo */
        section { scroll-margin-top: 60px; }
        
        .main-header {
            position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important;
            z-index: 100 !important; background: transparent !important; padding: 20px 0 !important;
        }
        .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 5%; position: relative; }
        
        /* ========================================== */
        /* MENU HAMBÚRGUER (MOBILE E DESKTOP)         */
        /* ========================================== */
        .mobile-menu-toggle {
            display: block; 
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 2.2rem;
            cursor: pointer;
            z-index: 1001;
            transition: transform 0.3s ease;
        }
        .mobile-menu-toggle:hover {
            transform: scale(1.1);
        }
        
        .main-nav {
            display: none; 
            position: absolute;
            top: 100%;
            right: 5%;
            background-color: rgba(17, 58, 35, 0.95); 
            backdrop-filter: blur(10px);
            padding: 25px 40px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .main-nav.active { 
            display: block; 
            animation: dropDown 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) forwards; 
        }
        @keyframes dropDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-nav ul { display: flex; flex-direction: column; list-style: none; gap: 20px; margin: 0; padding: 0; align-items: flex-end; }
        .main-nav a { color: #ffffff !important; text-decoration: none; font-weight: 500; font-size: 1.1rem; letter-spacing: 0.5px; transition: opacity 0.3s; }
        .main-nav a:hover { opacity: 0.7; }
        
        /* ========================================== */
        /* HERO SECTION E ANIMAÇÃO NATIVA             */
        /* ========================================== */
        .hero-section {
            position: relative !important; height: 100vh !important; min-height: 600px !important;
            display: flex !important; align-items: center !important; justify-content: center !important; 
            overflow: hidden !important; background-color: #2c302e !important; padding: 0 !important; margin: 0 !important;
        }
        .hero-image {
            position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; 
            z-index: 1 !important; border-radius: 0 !important;
        }
        .hero-image img { width: 100% !important; height: 100% !important; object-fit: cover !important; object-position: top !important; display: block !important; border-radius: 0 !important; }
        .hero-overlay { position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; background: rgba(44, 48, 46, 0.55) !important; z-index: 2 !important; }
        
        .hero-content {
            position: relative !important; z-index: 3 !important; width: 100% !important; max-width: 1200px !important; padding: 0 5% !important;
            margin-top: 60px !important; display: flex !important; flex-direction: column !important; align-items: center !important;
        }
        .hero-content h1 {
            color: #ffffff !important; font-size: 4.5rem !important; font-weight: 400 !important; font-style: italic !important; 
            text-align: center !important; margin-bottom: 20px !important; text-shadow: 2px 2px 10px rgba(0,0,0,0.5) !important; line-height: 1.2 !important;
            opacity: 0;
            animation: heroFade 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
        }
        @keyframes heroFade {
            0% { opacity: 0; transform: translateY(30px); filter: blur(5px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .floating-action-menu {
            position: fixed; bottom: 30px; right: 30px; z-index: 9999;
            display: flex; flex-direction: column; gap: 12px;
        }
        .floating-btn {
            background-color: #5a6659; color: #ffffff !important;
            padding: 14px 24px; border-radius: 50px; font-size: 0.85rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px; text-decoration: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); transition: 0.3s ease; text-align: center;
        }
        .floating-btn:hover { background-color: #3f473e; transform: translateY(-3px); }
        .floating-btn.secondary { background-color: #ffffff; color: #5a6659 !important; border: 1px solid #5a6659; }
        .floating-btn.secondary:hover { background-color: #f0f0f0; }

        .sobre-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
        .sobre-title { font-size: 3rem; line-height: 1.1; font-weight: 400; font-family: 'Playfair Display', serif; color: #2c302e; text-align: left; }
        .sobre-content { display: flex; gap: 40px; align-items: center; margin-bottom: 20px; }

        .sobre-image { 
            flex: 1; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; 
            transition: all 0.6s ease-in-out;
        }
        .sobre-image:hover {
            border-radius: 60% 40% 30% 70% / 50% 50% 40% 60%;
        }
        .sobre-image img { 
            width: 100%; height: 100%; min-height: 400px;
            object-fit: cover; display: block; 
        }
        .sobre-text { flex: 1.5; font-size: 0.95rem; line-height: 1.8; text-align: justify; color: #4a4a4a; }

        .plantao-container {
            max-width: 900px; margin: 0 auto; background-color: #ffffff;
            padding: 50px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        
        .plantao-badges {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 30px;
        }
        .badge-item {
            flex: 1;
            background-color: #f7f5f0;
            padding: 20px 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e8e5dc;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .badge-item:hover {
            transform: translateY(-8px);
            border-color: #5a6659;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .badge-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
            color: #5a6659;
        }
        .badge-info {
            font-size: 0.95rem;
            color: #4a4a4a;
            line-height: 1.4;
        }
        .badge-info strong {
            font-size: 1.1rem;
            color: #113A23;
            display: block;
            margin-top: 5px;
        }
        .plantao-alerta {
            background-color: #eaf0eb;
            border-left: 4px solid #5a6659;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            color: #333;
            line-height: 1.6;
        }
        .btn-plantao-acao {
            display: inline-block;
            background-color: #113A23;
            color: #ffffff !important;
            padding: 16px 35px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(17, 58, 35, 0.2);
            transition: all 0.3s ease;
        }
        .btn-plantao-acao:hover {
            background-color: #5a6659;
            transform: scale(1.05);
        }

        /* ========================================== */
  * LIGAÇÃO DA EQUIPE COM O SUPABASE RESTAURADA COM AS CHAVES CORRETAS!
                 * Agora o painel volta a controlar as três fotos normalmente!
                 * =========================================================================
                 updateImg('.hero-image img', dbMap['hero_imagem']);
                 updateImg('.team-grid .team-card:nth-child(1) img', dbMap['equipe_foto_1']);
                 updateImg('.team-grid .team-card:nth-child(2) img', dbMap['equipe_foto_2']);
                 updateImg('.team-grid .team-card:nth-child(3) img', dbMap['equipe_foto_3']);
                 updateImg('.modalities-grid .modality-card:nth-child(1) img', dbMap['modalidades_foto_online']);
                 updateImg('.modalities-grid .modality-card:nth-child(2) img', dbMap['modalidades_foto_presencial']);
 
                 aplicarEstiloImagem('.hero-image img', dbMap, 'hero_imagem');
                 aplicarEstiloImagem('.team-grid .team-card:nth-child(1) img', dbMap, 'equipe_foto_1');
                 aplicarEstiloImagem('.team-grid .team-card:nth-child(2) img', dbMap, 'equipe_foto_2');
                 aplicarEstiloImagem('.team-grid .team-card:nth-child(3) img', dbMap, 'equipe_foto_3');
                 aplicarEstiloImagem('.modalities-grid .modality-card:nth-child(1) img', dbMap, 'modalidades_foto');
                 aplicarEstiloImagem('.modalities-grid .modality-card:nth-child(2) img', dbMap, 'modalidades_foto');
 
                 const fonteTitulos = dbMap['geral_fonte_titulos'];
                 const fonteTextos = dbMap['geral_fonte_textos'];
                 
                 if (fonteTitulos || fonteTextos) {
                     const style = document.createElement('style');
                     let cssDinamico = '';
                     if (fonteTitulos) cssDinamico += `h1, h2, h3, h4, h5, h6, .section-title { font-family: '${fonteTitulos}', serif !important; } `;
                     if (fonteTextos) cssDinamico += `body, p, a, span, button, input, select, textarea, .crp, li, label, .btn-outline { font-family: '${fonteTextos}', sans-serif !important; } `;
                     style.innerHTML = cssDinamico;
                     document.head.appendChild(style);
                 }
                 
             } catch (erro) {
                 console.error('Erro na conexão dinâmica:', erro.message);
             }
         }
 
         document.addEventListener('DOMContentLoaded', carregarConteudoDinamico);
 
         const formularioNexo = document.querySelector('.nexo-form');
         const whatsappInput = document.getElementById('whatsapp');
 
         if (whatsappInput) {
             whatsappInput.addEventListener('input', (event) => {
                 let valor = event.target.value;
                 valor = valor.replace(/\D/g, ""); 
                 if (valor.length > 0) valor = "(" + valor;
                 if (valor.length > 3) valor = valor.slice(0, 3) + ") " + valor.slice(3);
                 if (valor.length > 10) valor = valor.slice(0, 10) + "-" + valor.slice(10, 15);
                 event.target.value = valor.slice(0, 15);
             });
         }
 
         if (formularioNexo) {
             formularioNexo.addEventListener('submit', async (event) => {
                 event.preventDefault(); 
                 const btnSubmit = document.getElementById('btn-submit');
                 btnSubmit.disabled = true;
                 btnSubmit.innerText = "Processando agendamento...";
 
                 const dadosFormulario = {
                     nome: document.getElementById('nome').value,
                     whatsapp: document.getElementById('whatsapp').value,
                     email: document.getElementById('email').value,
                     atendimento: document.getElementById('atendimento').value,
                     modalidade: document.getElementById('modalidade').value,
                     mensagem: document.getElementById('mensagem').value
                 };
 
                 try {
                     const response = await fetch('https://nexo-api-s2dz.onrender.com/api/agendamentos', {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify(dadosFormulario)
                     });
 
                     if (response.ok) {
                         alert('Agendamento enviado com sucesso! Entraremos em contato.');
                         formularioNexo.reset(); 
                     } else {
                         alert('Erro ao processar o agendamento no servidor. Código: ' + response.status);
                     }
                 } catch (error) {
                     console.error('Erro de conexão:', error);
                     alert('Estamos acordando o servidor... por favor, aguarde mais alguns segundos e tente novamente.');
                 } finally {
                     btnSubmit.disabled = false;
                     btnSubmit.innerText = "AGENDAR CONSULTA";
                 }
             });
         }
     </script>
</body>
</html>
